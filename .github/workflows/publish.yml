name: Publish

# Publishes to npm on every merge to main, but only the packages whose version
# in package.json differs from what is already on the registry. Bumping a
# version in a PR is therefore the release trigger — merging a PR that touches
# no version publishes nothing.
#
# Auth is npm trusted publishing (OIDC): npm trusts this workflow's identity, so
# there is no NPM_TOKEN to store or rotate, and the account's hardware security
# key is never involved. Provenance attestations are generated automatically.
#
# One-time setup on npmjs.com, per package (agent-shared, mcp-server, ai-tools):
#   Package → Settings → Trusted Publisher → GitHub Actions
#     Organization or user: HoudiniSwap
#     Repository:           houdiniswap-agent
#     Workflow filename:    publish.yml
#     Allowed actions:      npm publish
# Until all three are configured, this workflow fails on the unconfigured ones.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC trusted publishing
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing requires Node >= 22.14.0 and npm >= 11.5.1.
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Upgrade npm to a version that supports trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      # Order matters: mcp-server and ai-tools depend on agent-shared, so it has
      # to reach the registry first or a consumer installing in the gap gets a
      # package whose dependency does not resolve.
      - name: Publish changed packages
        run: |
          set -euo pipefail

          publish_if_changed() {
            local dir="$1"
            cd "$dir"

            local name local_version remote_version
            name=$(node -p "require('./package.json').name")
            local_version=$(node -p "require('./package.json').version")
            remote_version=$(npm view "$name" version 2>/dev/null || echo "")

            if [ "$local_version" = "$remote_version" ]; then
              echo "· $name@$local_version already on the registry — skipping"
            else
              echo "→ publishing $name@$local_version (registry has ${remote_version:-nothing})"
              npm publish
              echo "  published $name@$local_version"
            fi

            cd - > /dev/null
          }

          publish_if_changed packages/shared
          publish_if_changed packages/mcp-server
          publish_if_changed packages/ai-tools
