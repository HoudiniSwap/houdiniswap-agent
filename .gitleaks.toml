# Gitleaks configuration (HS-2658). Extends the built-in rule set.
#
# CI scans only the commits a pull request adds. Run the same scan locally
# before pushing:
#   gitleaks git --log-opts="origin/main..HEAD" --config .gitleaks.toml
#
# The allowlists below remove known false positives from `generic-api-key`,
# which fires on any field whose name contains "key" or "token" (public
# addresses, token IDs). They do not silence the private-key or provider rules.

[extend]
useDefault = true

[[allowlists]]
description = "Public on-chain identifiers matched by generic-api-key"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = [
    # EVM addresses and 32-byte hashes
    '''^0x[a-fA-F0-9]{40}$''',
    '''^0x[a-fA-F0-9]{64}$''',
    # Solana / base58 addresses (43-44 chars, no 0OIl). Not 32-42: a random
    # 32-40 character API key avoids 0OIl often enough to match.
    '''^[1-9A-HJ-NP-Za-km-z]{43,44}$''',
    # Mongo ObjectIds used as token IDs
    '''^[a-f0-9]{24}$''',
]

# The tests' Solana key is base58 of 64 bytes of 0x07: a made-up key shaped
# like a Phantom export, never a wallet. Exact value, and only in tests, so a
# different key there still fires.
[[allowlists]]
description = "Made-up Solana test key (64 bytes of 0x07), only in tests"
condition = "AND"
targetRules = ["generic-api-key", "hs-raw-private-key"]
regexTarget = "secret"
regexes = [
    '''^99eUso3aSbE9tqGSTXzo3TLfKb9RkMTURrHKQ1K7Zh3BbeqPevr5E1iCbpTjqHuTFLtfxTTD5ekfVuZFzQyEQf8$''',
]
paths = [
    '''^packages/[^/]+/__tests__/''',
]

# Raw signer keys (EVM, Solana) assigned to any name generic-api-key would
# look at (key, secret, token, auth, api, password, ...). The built-in rules miss a bare 64-hex or base58 key in a variable or
# .env line, and the allowlist above hides those shapes from generic-api-key,
# so this rule has to cover every name and assignment form it would have.
# HoudiniSwap's own public x402 receiving address (Solana) is allowlisted
# below by exact value.
[[rules]]
id = "hs-raw-private-key"
description = "Raw private key or seed assigned to a key-like name"
regex = '''(?i)[\w.-]{0,40}(?:key|secret|token|access|auth|api|credential|creds|passw(?:or)?d|mnemonic|seed[_.-]?phrase)[ \t\w.-]{0,20}[\s'"]{0,3}(?::{1,3}=|\?=|=>|\?\?|\|\||=|:|>|,)\s*["'\x60]?((?:0x)?[a-fA-F0-9]{64}|[1-9A-HJ-NP-Za-km-z]{43,44}|[1-9A-HJ-NP-Za-km-z]{86,88})(?:["'\x60\s;,)]|$)'''
secretGroup = 1
entropy = 3.0
keywords = ["key", "secret", "token", "access", "auth", "api", "cred", "passw", "mnemonic", "seed"]

[[allowlists]]
description = "HoudiniSwap's public x402 receiving address on Solana (exact value)"
targetRules = ["hs-raw-private-key"]
regexTarget = "secret"
regexes = [
    '''^Bdg25JW8RBHKeq5YDWDrbH5Q2H8GaZFwqD6G4zPn2P2x$''',
]
